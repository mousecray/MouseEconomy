pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupByRegex("net\\.fabricmc(\\..+)?")
                includeGroup('fabric-loom')
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter {
                includeGroup('org.spongepowered')
            }
        }

        maven {
            name = 'Forge'
            url = uri('https://maven.minecraftforge.net/')
        }

        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'MouseEconomy'
include("common")
include("fabric")
include("forge")

includeBuild('../Mousecore') {
    dependencySubstitution {
        substitute module('ru.mousecray.mousecore:mousecore-common') using project(':common')
        substitute module('ru.mousecray.mousecore:mousecore-forge') using project(':forge')
        substitute module('ru.mousecray.mousecore:mousecore-fabric') using project(':fabric')
    }
}